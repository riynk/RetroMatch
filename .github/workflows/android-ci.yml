name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and assemble Android variants
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon lint :app:testNormalDebugUnitTest :app:assembleNormalDebug :app:assembleFdroidDebug

      - name: Generate APK checksums
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 2 ]; then
            echo "Expected 2 APKs (Normal and F-Droid), found ${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          sha256sum "${apks[@]}" | tee app/build/outputs/apk/SHA256SUMS.txt

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: RetroMatch-debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/normal/debug/*.apk
            app/build/outputs/apk/fdroid/debug/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
